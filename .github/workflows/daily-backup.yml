name: Daily Database Backup

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run backup script
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash scripts/backup.sh

      - name: Commit and push
        run: |
          BACKUP_DATE=$(date +'%Y-%m-%d')
          git config user.name "Backup Bot"
          git config user.email "bot@oscarerp.com"
          git add backups/$BACKUP_DATE/
          git diff --cached --quiet || {
            git commit -m "chore: daily backup $BACKUP_DATE"
            git push
          }

      - name: Cleanup old (keep 30 days)
        run: |
          for d in $(ls -d backups/*/ 2>/dev/null | sort -r | tail -n +31); do
            rm -rf "$d"
          done
          git add backups/
          git diff --cached --quiet || {
            git config user.name "Backup Bot"
            git config user.email "bot@oscarerp.com"
            git commit -m "chore: cleanup old backups"
            git push
          }